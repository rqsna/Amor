<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💕 Amor Sin Final 💕</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    #ffd9ec 0 35px,
                    transparent 36px
                ),
                radial-gradient(
                    circle at 90% 15%,
                    #ffe9f4 0 45px,
                    transparent 46px
                ),
                linear-gradient(
                    135deg,
                    #fff0f7,
                    #ffd6e9
                );

            color: #6b3b52;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .container {
            width: min(950px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .small-decoration {
            font-size: 25px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 58px);
            margin: 5px 0;
            color: #d45b91;
        }

        .subtitle {
            font-size: 17px;
            margin: 10px auto;
            max-width: 600px;
            line-height: 1.6;
        }

        .name {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 18px;
            border-radius: 30px;
            background: #ffffffb8;
            border: 2px solid #f5a8ca;
        }

        .intro-card,
        .final-card {
            background: rgba(255,255,255,.82);
            border: 3px solid #f3b0ce;
            border-radius: 30px;
            padding: 45px 25px;
            text-align: center;
            max-width: 650px;
            margin: 30px auto;
            box-shadow:
                0 15px 35px rgba(180,80,120,.12);
        }

        .character-placeholder {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #ffe1ee;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 50px;
        }

        .intro-card h2,
        .final-card h2 {
            color: #cf5c90;
            font-size: 30px;
        }

        .intro-card p,
        .final-card p {
            font-size: 18px;
            line-height: 1.8;
        }

        .main-button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            background: #df78a8;
            color: white;
            font-size: 16px;
            cursor: pointer;

            box-shadow: 0 7px 0 #bd5b88;

            transition: .2s;
            margin-top: 15px;
        }

        .main-button:hover {
            transform: translateY(-2px);
        }

        .main-button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #bd5b88;
        }

        .map-section {
            margin-top: 30px;
        }

        .map-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .map-label {
            font-size: 12px;
            letter-spacing: 2px;
            color: #c56b91;
        }

        .map-top h2 {
            margin: 5px 0;
            color: #bd5b88;
        }

        #progress {
            background: white;
            border: 2px solid #f0b0ca;
            border-radius: 20px;
            padding: 8px 15px;
            white-space: nowrap;
        }

        .map {
            position: relative;

            min-height: 620px;

            background:
                radial-gradient(
                    circle,
                    #ffffff80 2px,
                    transparent 3px
                ),
                linear-gradient(
                    145deg,
                    #fff7fb,
                    #ffe1ee
                );

            background-size:
                30px 30px,
                auto;

            border: 3px solid #f1b0ca;
            border-radius: 35px;
            overflow: hidden;
        }

        .path {
            position: absolute;

            left: 50%;
            top: 60px;
            bottom: 60px;

            width: 8px;

            transform: translateX(-50%);

            border-left: 5px dashed #e89cbd;
        }

        #locations {
            position: relative;
            z-index: 2;
            padding: 50px 0;
        }

        .location {
            width: 100%;

            display: flex;
            justify-content: center;

            margin: 35px 0;
        }

        .location:nth-child(even) {
            transform: translateX(90px);
        }

        .location:nth-child(odd) {
            transform: translateX(-90px);
        }

        .location-button {
            width: 105px;
            height: 105px;

            border-radius: 50%;
            border: 5px solid white;

            background: #f7aaca;

            box-shadow:
                0 8px 20px rgba(150,70,110,.18);

            cursor: pointer;

            font-size: 37px;

            position: relative;

            transition: .25s;
        }

        .location-button:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .location-button.locked {
            background: #d8cbd1;
            cursor: not-allowed;
            filter: grayscale(.4);
        }

        .location-button.completed {
            background: #e889b3;
        }

        .location-button::after {
            content: attr(data-name);

            position: absolute;

            width: 180px;
            left: 50%;

            transform: translateX(-50%);

            top: 110px;

            font-size: 14px;

            color: #77465d;
            font-weight: bold;
        }

        .map-decoration {
            position: absolute;
            font-size: 30px;
            opacity: .8;
            pointer-events: none;
        }

        .decor1 {
            left: 8%;
            top: 13%;
        }

        .decor2 {
            right: 10%;
            top: 32%;
        }

        .decor3 {
            left: 10%;
            bottom: 25%;
        }

        .decor4 {
            right: 8%;
            bottom: 10%;
        }

        .map-hint {
            text-align: center;
            font-size: 14px;
        }

        .reset-button {
            display: block;

            margin: 15px auto;

            border: none;
            background: transparent;

            color: #9d687f;

            text-decoration: underline;

            cursor: pointer;
        }

        /* SECRET BUTTON */

        .secret-button {
            position: absolute;
            bottom: 12px;
            right: 12px;

            width: 42px;
            height: 42px;

            border: 2px solid #f1b0ca;
            border-radius: 50%;

            background: rgba(255,255,255,.8);

            color: #bd5b88;

            cursor: pointer;

            font-size: 18px;

            opacity: .75;

            transition: .2s;

            z-index: 10;
        }

        .secret-button:hover {
            transform: scale(1.1);
            opacity: 1;
        }

        /* SECRET BOX */

        .secret-box {
            width: min(600px, 100%);
            margin: 25px auto;

            background: rgba(255,255,255,.9);

            border: 3px solid #f1b0ca;
            border-radius: 30px;

            padding: 30px 25px;

            text-align: center;

            box-shadow:
                0 15px 35px rgba(180,80,120,.15);
        }

        .secret-box h2 {
            color: #cf5c90;
        }

        .secret-box p {
            font-size: 18px;
            line-height: 1.8;
        }

        .secret-image {
            max-width: 90%;
            max-height: 350px;

            border-radius: 20px;

            margin: 15px auto;

            display: block;

            object-fit: contain;
        }

        .final-hearts {
            font-size: 30px;
        }

        .big-heart {
            font-size: 80px;

            animation:
                heartbeat 1.3s infinite;
        }

        .floating-heart {
            position: fixed;

            z-index: -1;

            color: #f1a7c8;

            font-size: 35px;

            opacity: .5;

            animation:
                float 5s ease-in-out infinite;

            pointer-events: none;
        }

        .heart1 {
            top: 15%;
            left: 5%;
        }

        .heart2 {
            top: 65%;
            right: 6%;
            animation-delay: 1s;
        }

        .heart3 {
            top: 35%;
            right: 3%;
            animation-delay: 2s;
        }

        .heart4 {
            bottom: 10%;
            left: 7%;
            animation-delay: 3s;
        }

        .modal {
            position: fixed;
            inset: 0;

            background:
                rgba(90,40,60,.45);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 20;
        }

        .modal-box {
            width: min(550px, 100%);

            background: #fff8fc;

            border: 4px solid #f1a8c8;
            border-radius: 30px;

            padding: 35px 25px;

            text-align: center;

            position: relative;

            box-shadow:
                0 20px 60px rgba(80,30,50,.25);

            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            position: absolute;

            right: 15px;
            top: 10px;

            border: none;
            background: none;

            font-size: 32px;

            color: #9d687f;

            cursor: pointer;
        }

        .modal-emoji {
            font-size: 55px;
        }

        .modal-box h2 {
            color: #cf5c90;
        }

        .modal-box p {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-line;
        }

        .modal-image {
            width: min(90%, 450px);
            max-height: 300px;

            border-radius: 20px;

            margin: 15px auto;

            object-fit: contain;

            display: block;

            border: 3px solid #f1b0ca;
        }

        .hidden {
            display: none !important;
        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

        }

        @media (max-width: 600px) {

            .container {
                padding-top: 20px;
            }

            .map {
                min-height: 700px;
            }

            .location:nth-child(even) {
                transform: translateX(55px);
            }

            .location:nth-child(odd) {
                transform: translateX(-55px);
            }

            .location-button {
                width: 85px;
                height: 85px;
                font-size: 30px;
            }

            .location-button::after {
                top: 90px;
                width: 140px;
                font-size: 12px;
            }

            .map-top {
                align-items: flex-start;
            }

        }

    </style>
</head>

   ============================================================ */

            Number(savedLevel);

            unlockedLevel =
                Math.min(
                    Math.max(

                    CONFIG.lugares.length - 1

/* ============================================================
   RENDER SECRET IMAGE
   ============================================================ */

function renderSecretImage() {

    if (
        CONFIG.imagenSecreta &&
        CONFIG.imagenSecreta.trim() !== ""
    ) {

        secretImage.src =
            CONFIG.imagenSecreta;

        secretImage.classList.remove(
            "hidden"
        );

        secretImage.onerror =
            function () {

                secretImage.classList.add(
                    "hidden"
                );

            };

    } else {

        secretImage.removeAttribute(
            "src"
        );

        secretImage.classList.add(
            "hidden"
        );

    }

}


/* ============================================================
   RENDER MAP
   ============================================================ */

function renderMap() {

    locationsContainer.innerHTML = "";


    /*
       Show progress.

       unlockedLevel is zero-based,
       so +1 makes the display easier to understand.
    */

    const completedCount =
        Math.min(
            unlockedLevel,
            CONFIG.lugares.length
        );


    progress.textContent =
        completedCount +
        " / " +
        CONFIG.lugares.length;


    CONFIG.lugares.forEach(
        (lugar, index) => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "location";


            const button =
                document.createElement("button");

            button.className =
                "location-button";


            button.setAttribute(
                "data-name",
                lugar.nombre
            );


            /*
               LOCKED
            */

            if (index > unlockedLevel) {

                button.classList.add(
                    "locked"
                );

                button.disabled = true;

                button.textContent =
                    "🔒";

            }


            /*
               AVAILABLE / COMPLETED
            */

            else {

                button.textContent =
                    lugar.emoji || "💗";


                if (index < unlockedLevel) {

                    button.classList.add(
                        "completed"
                    );

                }

            }


            /*
               OPEN LOCATION
            */

            button.addEventListener(
                "click",
                () => {

                    if (
                        index <= unlockedLevel
                    ) {

                        openLocation(index);

                    }

                }
            );


            wrapper.appendChild(button);

            locationsContainer.appendChild(
                wrapper
            );

        }
    );

}


/* ============================================================
   OPEN LOCATION
   ============================================================ */

function openLocation(index) {

    const lugar =
        CONFIG.lugares[index];


    if (!lugar) {
        return;
    }


    currentLevel =
        index;


    modalEmoji.textContent =
        lugar.emoji || "💗";


    modalTitle.textContent =
        lugar.nombre;


    modalMessage.textContent =
        lugar.mensaje;


    /*
       IMAGE
    */

    if (
        lugar.imagen &&
        lugar.imagen.trim() !== ""
    ) {

        modalImage.src =
            lugar.imagen;

        modalImage.classList.remove(
            "hidden"
        );


        modalImage.onerror =
            function () {

                modalImage.classList.add(
                    "hidden"
                );

            };

    } else {

        modalImage.removeAttribute(
            "src"
        );

        modalImage.classList.add(
            "hidden"
        );

    }


    /*
       BUTTON TEXT
    */

    if (
        index ===
        CONFIG.lugares.length - 1
    ) {

        continueButton.textContent =
            "Terminar 💗";

    } else {

        continueButton.textContent =
            CONFIG.botonContinuar;

    }


    modal.classList.remove(
        "hidden"
    );

}


/* ============================================================
   CLOSE MODAL
   ============================================================ */

function closeCurrentModal() {

    modal.classList.add(
        "hidden"
    );

}


/* ============================================================
   CONTINUE BUTTON
   ============================================================ */

continueButton.addEventListener(
    "click",
    function () {

        closeCurrentModal();


        /*
           LAST LEVEL
        */

        if (
            currentLevel ===
            CONFIG.lugares.length - 1
        ) {

            finalSection.classList.remove(
                "hidden"
            );


            finalSection.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });


            return;
        }


        /*
           UNLOCK NEXT LEVEL
        */

        if (
            currentLevel >=
            unlockedLevel
        ) {

            unlockedLevel =
                currentLevel + 1;

        }


        /*
           SAVE PROGRESS
        */

        try {

            sessionStorage.setItem(
                "nivelAmor",
                String(unlockedLevel)
            );

        } catch (error) {

            console.log(
                "No se pudo guardar el progreso."
            );

        }


        renderMap();

    }
);


/* ============================================================
   CLOSE BUTTON
   ============================================================ */

closeModal.addEventListener(
    "click",
    closeCurrentModal
);


/* ============================================================
   CLICK OUTSIDE MODAL
   ============================================================ */

modal.addEventListener(
    "click",
    function (event) {

        if (
            event.target === modal
        ) {

            closeCurrentModal();

        }

    }
);


/* ============================================================
   ESC KEY
   ============================================================ */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            closeCurrentModal();

        }

    }
);


/* ============================================================
   START BUTTON
   ============================================================ */

startButton.addEventListener(
    "click",
    function () {

        intro.classList.add(
            "hidden"
        );


        mapSection.classList.remove(
            "hidden"
        );


        renderMap();


        mapSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }
);


/* ============================================================
   RESET BUTTON
   ============================================================ */

resetButton.addEventListener(
    "click",
    function () {

        const confirmar =
            confirm(
                "¿Seguro que quieres reiniciar nuestro viaje? 💗"
            );


        if (!confirmar) {
            return;
        }


        unlockedLevel = 0;

        currentLevel = 0;


        try {

            sessionStorage.removeItem(
                "nivelAmor"
            );

        } catch (error) {

            console.log(
                "No se pudo borrar el progreso."
            );

        }


        finalSection.classList.add(
            "hidden"
        );


        secretBox.classList.add(
            "hidden"
        );


        renderMap();

    }
);


/* ============================================================
   🔐 SECRET BUTTON
   ============================================================ */

secretButton.addEventListener(
    "click",
    function () {

        const codigo =
            prompt(
                "🔐 Introduce el código secreto:"
            );


        if (codigo === null) {
            return;
        }


        if (
            codigo ===
            CONFIG.codigoSecreto
        ) {

            renderSecretImage();


            secretBox.classList.remove(
                "hidden"
            );


            secretBox.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        } else {

            alert(
                "❌ Código incorrecto 💗"
            );

        }

    }
);


/* ============================================================
   CLOSE SECRET
   ============================================================ */

closeSecret.addEventListener(
    "click",
    function () {

        secretBox.classList.add(
            "hidden"
        );

    }
);


/* ============================================================
   INITIAL MAP RENDER
   ============================================================ */

renderMap();

</script>

</body>
</html>
